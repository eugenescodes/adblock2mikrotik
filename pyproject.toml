[project]
name = "adblock2mikrotik"
version = "0.1.0"
description = "Convert AdBlock filter lists to MikroTik RouterOS DNS adlist format"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
adblock2mikrotik = "adblock2mikrotik.converter:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "pytest>=9.1.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
log_level = "INFO"

[tool.ruff.lint]
# E/W — pycodestyle, F — pyflakes, I — isort, UP — pyupgrade
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"] # Ignore line length errors
