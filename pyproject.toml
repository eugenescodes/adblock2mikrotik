[project]
name = "adblock2mikrotik"
version = "0.1.0"
description = "Convert AdBlock filter lists to MikroTik RouterOS DNS adlist format"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
adblock2mikrotik = "adblock2mikrotik.converter:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "pytest>=9.1.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest]
addopts = ["-ra", "-q"]
testpaths = ["tests"]
log_level = "INFO"

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF", "S", "N", "ANN", "PT", "PTH", "PERF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72
