version: 2
updates:

  # Configuration for GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  # Configuration for Python dependencies managed by uv
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily

  # Configuration for Docker dependencies
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # At most one open Docker update PR at a time (python base image, uv image);
    # the next one is opened after it's merged or closed. 0 would disable them.
    open-pull-requests-limit: 1
