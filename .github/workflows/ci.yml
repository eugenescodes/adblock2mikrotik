name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Check-only: nothing is fixed or committed here. Formatting is fixed locally
  # by the pre-commit hook (see README → Development); CI fails if it wasn't run.
  lint-and-test:
    runs-on: ubuntu-latest
    concurrency:
      group: lint-and-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Same hooks as the local git hook (ruff check/format, rumdl for markdown lint, file
      # hygiene, uv.lock, workflow schemas). Any hook that would modify a file
      # fails the job and prints the diff, so an unformatted PR goes red.
      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure --color always

      - name: Run mypy
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest -v

  # Also runs on PRs, so a change that breaks the image is caught before merge.
  # Docker layers are cached using the GitHub Actions cache.
  docker-build:
    runs-on: ubuntu-latest
    concurrency:
      group: docker-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker Image with GHA Cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: adblock2mikrotik:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No network: verify the default user, writable output dir, CLI, package,
      # and bundled default config in the built image.
      - name: Smoke test Docker image
        run: |
          docker run --rm --network none adblock2mikrotik:ci-test --help
          docker run --rm --network none \
            --entrypoint python adblock2mikrotik:ci-test \
            -c "import os; from adblock2mikrotik import converter as c; assert os.getuid() != 0, 'container must not run as root'; assert os.access('/output', os.W_OK), '/output must be writable'; assert c._read_source_urls(c._DEFAULT_CONFIG_FILE), 'bundled config must be valid'; print(f'Image OK (uid={os.getuid()})')"

      # Report CRITICAL/HIGH OS and Python package CVEs without failing the
      # build on findings; this gives us a baseline before enabling a gate.
      - name: Scan image for vulnerabilities (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: adblock2mikrotik:ci-test
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
