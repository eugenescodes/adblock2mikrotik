name: Publish hosts to GitHub Pages

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the artifact containing the generated hosts list
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download generated list
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: artifact

      - name: Check whether the list changed
        id: change
        run: |
          value="$(cat artifact/publish-changed.txt)"
          if [[ "$value" != "true" && "$value" != "false" ]]; then
            echo "Invalid change marker: $value" >&2
            exit 1
          fi
          echo "changed=$value" >> "$GITHUB_OUTPUT"

      - name: Prepare Pages artifact
        if: steps.change.outputs.changed == 'true'
        run: |
          mkdir -p _site
          cp artifact/hosts.txt _site/hosts.txt

      - name: Configure GitHub Pages
        if: steps.change.outputs.changed == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: steps.change.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.change.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Skip deployment when the list is unchanged
        if: steps.change.outputs.changed == 'false'
        run: echo "The blocklist has not changed; keeping the current Pages deployment."
