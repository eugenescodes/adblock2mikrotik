name: Update hosts

permissions:
  contents: read

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-hosts:
    runs-on: ubuntu-latest
    # Avoid concurrent runs comparing and publishing against the same Pages version.
    concurrency:
      group: update-hosts
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate hosts.txt
        run: uv run adblock2mikrotik

      - name: Compare with published list
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          published_file="$RUNNER_TEMP/published-hosts.txt"
          published_url="https://eugenescodes.github.io/adblock2mikrotik/hosts.txt?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          status="$(curl --silent --show-error --location \
            --retry 3 \
            --output "$published_file" \
            --write-out '%{http_code}' \
            "$published_url")"

          if [[ "$status" == "404" ]]; then
            echo "Published list not found; this will be the initial deployment."
            changed=true
          elif [[ "$status" != "200" ]]; then
            echo "Unexpected HTTP status while checking published list: $status" >&2
            exit 1
          else
            set +e
            diff -u \
              <(sed '/^# Last modified:/d' hosts.txt) \
              <(sed '/^# Last modified:/d' "$published_file") \
              > "$RUNNER_TEMP/hosts.diff"
            diff_status=$?
            set -e

            case "$diff_status" in
              0) changed=false ;;
              1) changed=true ;;
              *)
                cat "$RUNNER_TEMP/hosts.diff" >&2
                echo "Failed to compare generated and published hosts lists." >&2
                exit "$diff_status"
                ;;
            esac
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "$changed" > publish-changed.txt

      - name: Upload generated list for Pages deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosts-publish-${{ github.run_id }}
          path: |
            hosts.txt
            publish-changed.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: update-hosts
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: $/.github/workflows/publish-hosts.yml
    with:
      artifact-name: hosts-publish-${{ github.run_id }}
