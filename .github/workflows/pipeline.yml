name: Pipeline

# Least privilege by default; only update-hosts needs to push (see below).
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Concurrency is set per job (not workflow-wide): a push to main must not cancel
# a running scheduled hosts.txt update, and vice versa.

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: LINT & TEST — push / PR / dispatch
  # Check-only: nothing is fixed or committed here. Formatting is fixed locally
  # by the pre-commit hook (see README → Development); CI fails if it wasn't run.
  # ─────────────────────────────────────────────
  lint-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: lint-and-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Same hooks as the local git hook (ruff check/format, markdownlint, file
      # hygiene, uv.lock, workflow schemas). Any hook that would modify a file
      # fails the job and prints the diff, so an unformatted PR goes red.
      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure --color always

      - name: Run mypy
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest -v

  # ─────────────────────────────────────────────
  # JOB 2: DOCKER BUILD CHECK — push / PR / dispatch
  # Also on PRs, so a change that breaks the image (Dockerfile, pyproject.toml,
  # uv.lock) is caught before merge, not after. Layers are cached (GHA cache).
  # ─────────────────────────────────────────────
  docker-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image with GHA Cache
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: adblock2mikrotik:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No network: checks the installed package imports and that the bundled
      # default config (package data) made it into the image and is valid.
      - name: Verify image — package and bundled config, no network
        run: |
          docker run --rm --network none \
            --entrypoint python adblock2mikrotik:ci-test \
            -c "from adblock2mikrotik import converter as c; assert c._read_source_urls(c._DEFAULT_CONFIG_FILE); print('Image OK')"

  # ─────────────────────────────────────────────
  # JOB 3: UPDATE HOSTS — schedule + dispatch
  # ─────────────────────────────────────────────
  update-hosts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The only job that pushes to the repository.
    permissions:
      contents: write
    # One shared group, never cancelled: an in-flight update always finishes,
    # and a second trigger waits for it instead of racing on the push.
    concurrency:
      group: update-hosts
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run conversion script
        run: uv run adblock2mikrotik

      - name: Commit and push hosts.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # The "# Last modified:" header line changes on every run; ignore it so
          # a commit is made only when the domain list itself changed.
          if ! git diff --quiet -I '^# Last modified:' -- hosts.txt; then
            git add hosts.txt
            git commit -m "Update hosts.txt via schedule"
            git pull --rebase origin main
            git push origin main
          else
            echo "No domain changes (only the timestamp) — nothing to commit."
          fi
